<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYN CALCULATOR</title>
  <link rel="stylesheet" href="calc.css">
  <script src="calc.js"></script>
</head>
<body>
  <h1>MYN CALCULATOR</h1>
  <input type="number" name="screen" id="screen" readonly placeholder="0"><br>
  <button class="btn">(</button>
  <button class="btn">)</button>
  <button class="btn-e">Del</button>
  <button class="btn-e">AC</button><br>
  <button class="btn" onclick="no1()">1</button>
  <button class="btn" onclick="no2()">2</button>
  <button class="btn" onclick="no3()">3</button>
  <button class="btn" onclick="no4()">+</button><br>
  <button class="btn" onclick="no5()">4</button>
  <button class="btn" onclick="no6()">5</button>
  <button class="btn" onclick="no7()">6</button>
  <button class="btn" onclick="no8()">-</button><br>
  <button class="btn" onclick="no9()">7</button>
  <button class="btn" onclick="no10()">8</button>
  <button class="btn" onclick="no11()">9</button>
  <button class="btn" onclick="no12()">x</button><br>
  <button class="btn" onclick="no13()">0</button>
  <button class="btn" onclick="no14()">.</button>
  <button class="btn" onclick="no15()">=</button>
  <button class="btn" onclick="no16()">/</button>
</body>
</html>
